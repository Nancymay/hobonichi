<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7E3DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фотоквиток">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/ibm-plex-mono-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<title>Фотоквиток</title>
</head>
<body>
<main class="app">
  <section id="today" aria-label="Сегодня">
    <div class="stage">
      <div class="printer idle" id="printer" aria-hidden="true">
        <span class="led"></span><span class="knob"></span><span class="slot"></span>
        <span class="model">КВ-1</span><span class="vent"><i></i><i></i><i></i></span>
      </div>
      <div class="feed" id="feed"><div class="paper-wrap" id="paperWrap"></div></div>
      <div class="hint" id="hint" hidden><span class="pull"></span>Потяните бумагу вниз</div>
    </div>
  </section>
  <section id="roll" aria-label="Мой рулон" hidden></section>
</main>
<div class="dock">
  <div class="actions" id="actions"></div>
  <nav class="tabs" aria-label="Разделы">
    <button id="tab-today" aria-current="page">Сегодня</button>
    <button id="tab-roll">Мой рулон</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="pick1" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
