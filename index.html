/* Calm tinted outside, quiet paper inside. Phone first: one page per screen, title on top, tabs and tools in a thumb-reach footer. Week spread is set in a handwriting face. */
:root{
  --bright:#ecd3c8;
  --on-bright:#2a2724;
  --paper:#fcfbf8;
  --grid:#e8e7e1;
  --rule:#ecebe5;
  --ink:#000;
  --quiet:#7a776f;
  --sun:#c9573f;
  --sat:#5279ad;
  --pill:#2a2724;
  --stamp-paper:#fffef9;
  --font:"Onest","Helvetica Neue",system-ui,sans-serif;
  --hand:"Yes siree bob","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bright);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;transition:background-color .5s ease;overscroll-behavior:none}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--on-bright);outline-offset:2px}

/* header */
/* header: one light centred row. chevron, title, chevron; equal 36px targets; one type size pair (22/16) on a shared baseline */
.bar{display:grid;grid-template-columns:36px 40px minmax(0,1fr) 40px 36px;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);color:var(--on-bright)}
.title{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding:2px 8px;border-radius:12px}
.title .row{display:flex;align-items:center;justify-content:center;gap:7px;max-width:100%;min-width:0}
.title b{font-weight:300;font-size:22px;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums;opacity:.55}
.title .nm{font-weight:500;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.title .chip{flex:none;width:20px;height:20px;border-radius:50%;background:rgba(42,39,36,.09);display:inline-flex;align-items:center;justify-content:center;margin-left:1px}
.title .chip svg{display:block;opacity:.7}
.title b[hidden]{display:none}
.title .st{font-size:11px;line-height:1.3;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.title .st.warn{opacity:.75}
.title select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.title:active{background:rgba(42,39,36,.05)}
.nav{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--on-bright);display:flex;align-items:center;justify-content:center;padding:0}
.nav svg{display:block}
.nav:hover{background:rgba(42,39,36,.06)} .nav:active{background:rgba(42,39,36,.1)}

/* desk */
.desk{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px calc(env(safe-area-inset-right) + 18px) 16px calc(env(safe-area-inset-left) + 18px);display:flex;align-items:flex-start}
.spread{margin:0 auto;display:flex;flex-direction:column;gap:12px;font-size:var(--em,16px)}
.spread.two{flex-direction:row;gap:0;margin:auto}
.page{position:relative;flex:none;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;display:flex;flex-direction:column;padding:1.4em 1.2em 1.1em;border-radius:18px;box-shadow:0 10px 30px -16px rgba(60,40,20,.28)}
.spread:not(.two) .page.fill{height:var(--phf)}
.spread:not(.two) .page.gridp{height:var(--phg)}
.page.auto{height:auto!important}
.spread.two .page.l{border-radius:18px 3px 3px 18px;box-shadow:inset -14px 0 18px -16px rgba(0,0,0,.16),0 10px 30px -16px rgba(60,40,20,.28)}
.spread.two .page.r{border-radius:3px 18px 18px 3px;box-shadow:inset 14px 0 18px -16px rgba(0,0,0,.16),0 10px 30px -16px rgba(60,40,20,.28)}

/* month */
.mhead,.whead{display:flex;align-items:baseline;gap:.5em;min-height:2.3em;flex:none}
.mhead .t,.whead .t{font-weight:500;font-size:1.05em}
.mhead .q,.whead .q{font-size:.72em;color:var(--quiet);margin-left:auto;text-align:right}
.mgrid{flex:1;min-height:0;display:grid}
.mgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mgrid.c7{grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{font-size:.66em;color:var(--quiet);padding:0 .4em .5em;border-bottom:1px solid var(--rule)}
.wd.sat{color:var(--sat)} .wd.sun{color:var(--sun)}
.cell{position:relative;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);min-height:0;padding:.25em;display:flex}
.c4 .cell:nth-child(4n),.c7 .cell:nth-child(7n){border-right:0}
.dn{position:absolute;top:.3em;left:.4em;font-size:.78em;font-weight:500;font-variant-numeric:tabular-nums;z-index:2;color:var(--ink)}
.cell.sat .dn{color:var(--sat)} .cell.sun .dn,.cell.hol .dn{color:var(--sun)}
.cell.out .dn{color:var(--quiet);opacity:.4;font-weight:400}
.cell.today .dn{background:var(--on-bright);color:var(--paper);border-radius:1em;padding:0 .4em;left:.2em}
.slot{flex:1;min-width:0;min-height:0;border:0;background:none;padding:.15em 0 0 1.1em;display:flex;align-items:center;justify-content:center;container-type:size}
.c7 .slot{padding:1.25em 0 0}
.ghost,.stamp{width:min(100cqw,calc(88cqh * .8));aspect-ratio:4/5}
.ghost{background:#000;opacity:.025;-webkit-mask-image:var(--perf);mask-image:var(--perf);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.slot:hover .ghost,.slot:focus-visible .ghost{opacity:.09}
.notes{min-width:0;overflow:hidden;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;padding:.25em .2em .2em .6em}
.notes a,.nrow a{font-size:.62em;color:var(--quiet);text-decoration:none;padding:.15em 0 .3em}
.notes textarea{flex:1;width:100%;min-width:0;border:0;background:transparent;resize:none;font-family:var(--hand);font-size:.8em;line-height:1.45;padding:0;outline:none;min-height:0}
.nrow{display:flex;flex-direction:column;border-top:1px solid var(--rule);padding:.6em 0 .4em}
.nrow textarea{border:0;background:transparent;resize:none;font-family:var(--hand);font-size:1.05em;line-height:1.45;min-height:2.9em;padding:0;outline:none;width:100%}

/* stamp */
.stamp{position:relative;transform:rotate(var(--rot,0deg));filter:drop-shadow(0 1px 1px rgba(0,0,0,.2)) drop-shadow(0 3px 5px rgba(0,0,0,.08))}
.stamp .sh{position:absolute;inset:0;background:var(--stamp-paper);-webkit-mask-image:var(--perf);mask-image:var(--perf);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.stamp img{position:absolute;left:8%;top:6.4%;width:84%;height:87.2%;object-fit:cover;display:block}
.stamp .den{position:absolute;right:11%;top:8.5%;font-weight:600;color:#fff;font-size:.55em;text-shadow:0 0 3px rgba(0,0,0,.55);line-height:1}
.c7 .stamp .den{display:none}
.stamp.big{width:min(72vw,400px);font-size:26px}

/* week (handwriting) */
.wk{font-family:var(--hand)}
.wk .whead .t{font-weight:400;font-size:1.3em}
.wk .whead .q{font-size:.85em}
.days{flex:1;min-height:0;display:grid;grid-template-rows:repeat(7,1fr);border-top:1px solid var(--rule)}
.day{display:grid;grid-template-columns:4.2em 1fr;border-bottom:1px solid var(--rule);min-height:0}
.dlab{padding:.35em 0 0;display:flex;flex-direction:column;line-height:1.05;min-width:0;overflow:hidden}
.dlab b{font-weight:400;font-size:1.7em;font-variant-numeric:tabular-nums}
.dlab span{font-size:.8em;color:var(--quiet);margin-top:.1em}
.dlab em{font-style:normal;font-size:.62em;color:var(--sun);margin-top:.3em;line-height:1.15;padding-right:.3em}
.day.sat .dlab b{color:var(--sat)}
.day.sun .dlab b,.day.hol .dlab b{color:var(--sun)}
.day.out .dlab{opacity:.45}
.day.today .dlab b{text-decoration:underline wavy var(--sun) 1px;text-underline-offset:.2em}
.day textarea{border:0;resize:none;background:transparent;font-family:var(--hand);font-size:1.05em;line-height:1.45;padding:.4em .2em 0;outline:none;min-height:0;width:100%}
.gridarea{flex:1;min-height:0;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:var(--sq) var(--sq);background-position:-1px -1px;border-top:1px solid var(--rule)}
.ink{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none}
.ink.off{pointer-events:none}

/* footer: tabs + tools within thumb reach */
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 12px calc(env(safe-area-inset-bottom) + 10px)}
.tools{display:flex;align-items:center;gap:2px;background:var(--pill);color:#fff;border-radius:999px;padding:5px;max-width:100%;overflow-x:auto;scrollbar-width:none;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
.tools::-webkit-scrollbar{display:none}
.tools[hidden]{display:none}
.tool{height:38px;padding:0 13px;border-radius:999px;border:0;background:transparent;color:#fff;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.tool[aria-pressed="true"]{background:var(--bright);color:var(--on-bright)}
.sw{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--c);flex:none;margin:0 3px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.sw[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 0 0 2px var(--pill),0 0 0 4px #fff}
.sz{width:32px;height:38px;border:0;border-radius:999px;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.sz i{display:block;border-radius:50%;background:#fff;opacity:.4}
.sz[aria-pressed="true"] i{opacity:1}
.sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 5px;flex:none}
.seg{display:flex;background:rgba(42,39,36,.08);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;color:var(--on-bright);padding:8px 22px;border-radius:999px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--pill);color:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(42,39,36,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.mbox{background:var(--paper);border-radius:26px 26px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
@media (min-width:700px){.modal{align-items:center;padding:16px}.mbox{border-radius:24px;padding-bottom:24px}}
.mbox h2{margin:0;font-weight:500;font-size:19px;text-wrap:balance;text-align:center}
.mbox p{margin:0;color:var(--quiet);text-align:center;font-size:14px;max-width:40ch}
.acts{display:flex;gap:8px;flex-direction:column;width:100%}
.btn{height:50px;padding:0 20px;border-radius:999px;border:0;background:#f0efe9;font-weight:500;font-size:16px}
.btn.primary{background:var(--pill);color:#fff}
.btn.danger{color:var(--sun)}

/* cover: pattern around the pages; header and footer sit on frosted paper so they stay readable */
:root{--tile:300px}
@media (min-width:700px){:root{--tile:420px}}
.bar,.foot{background:rgba(252,251,248,.66);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15)}
.foot{padding-top:8px}
.frow{position:relative;display:flex;justify-content:center;align-items:center;width:100%;max-width:640px}
.desk{padding-top:14px}
.cover-btn{width:36px;height:36px;border-radius:50%;border:2px solid #fff;padding:0;box-shadow:0 0 0 1px rgba(42,39,36,.14);flex:none}
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;width:100%}
.cv{border:0;background:none;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;padding:0;color:var(--ink)}
.cv .pv{width:100%;aspect-ratio:1;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(42,39,36,.1);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;color:var(--quiet)}
.cv[aria-pressed="true"] .pv{box-shadow:inset 0 0 0 1px rgba(42,39,36,.1),0 0 0 3px var(--paper),0 0 0 5px var(--pill)}
.linkbtn{border:0;background:none;color:var(--quiet);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* to-do on the week's right page: rows sit on the grid (two squares tall), hand-drawn boxes, wobbly strike */
.gridarea{position:relative}
.mini{display:flex;margin-left:auto;background:rgba(42,39,36,.06);border-radius:999px;padding:2px;font-family:var(--font)}
.mini button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:.62em;color:var(--quiet);font-weight:500}
.mini button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.todo{position:absolute;inset:0;overflow-y:auto;padding:0 .2em;--row:calc(var(--sq) * 2)}
.ti{display:flex;align-items:flex-start;gap:.45em;min-height:var(--row);--lh:1.18em;--cbs:calc(var(--row) * .5)}
.cb{flex:none;width:var(--cbs);height:var(--cbs);margin-top:calc((var(--row) - var(--cbs)) / 2);border:0;background:none;padding:0;color:var(--ink)}
.cb svg{display:block;width:100%;height:100%;overflow:visible}
.cb .ck{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .25s ease}
.ti.done .cb .ck{stroke-dashoffset:0}
.ti.new .cb{opacity:.35;pointer-events:none}
.tw{position:relative;flex:1;min-width:0;display:flex}
.tt{display:block;width:100%;border:0;background:transparent;font-family:var(--hand);font-size:1.05em;color:var(--ink);outline:none;line-height:var(--lh);padding:calc((var(--row) - var(--lh)) / 2) 0;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
.tt::placeholder{color:var(--quiet);opacity:.7}
.ti.done .tt{color:var(--quiet)}
.strike{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.strike path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset .35s ease}
.ti:not(.done) .strike{display:none}
.tx-del{flex:none;border:0;background:none;color:var(--quiet);font-size:1.1em;width:1.6em;height:1.6em;border-radius:50%;opacity:0;padding:0}
.ti:focus-within .tx-del,.ti:hover .tx-del{opacity:.7}
.mode-todo .gridarea{background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:100% calc(var(--sq) * 2)}

.dlist{min-width:0;min-height:0;overflow-y:auto;padding:.3em 0 .2em;--row:1.75em}
.dlist .ti{gap:.4em;--row:1.7em;--lh:1.15em;--cbs:.9em}

.dlist .tt{font-size:1em}
.dlist .ti.new .tt::placeholder{opacity:.45}

.ti.plain .cb{display:none}
/* to-do tool: boxes show only in the day you tap */
.tool-check .dlist.active .ti.plain .cb{display:block;opacity:.3}
.tool-check .dlist.active .ti.new.plain .cb{opacity:.55}
.tool-check .dlist.active .ti.plain .cb:hover{opacity:.6}
.ti.plain .tx-del{display:none}
/* handwriting face is thin: black ink plus a hair of stroke so it reads on paper */
.wk,.tt,.notes textarea,.nrow textarea{-webkit-text-stroke:.3px currentColor}
.ti.done .tt{-webkit-text-stroke:0}
.tt{-webkit-text-fill-color:currentColor;opacity:1}
/* phone: a day grows with what you write */
.spread:not(.two) .page.l.wk{height:auto;min-height:var(--phf)}
.spread:not(.two) .wk .days{grid-template-rows:none;grid-auto-rows:minmax(calc((var(--phf) - 6em) / 7),auto)}
.spread:not(.two) .dlist{overflow:visible;padding-bottom:.6em}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <button class="cover-btn" id="cover-btn" aria-label="Выбрать обложку"></button>
  <button class="nav" id="prev" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <label class="title">
    <span class="row"><b id="t-num">01</b><span class="nm" id="t-name">Январь</span><span class="chip" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg></span></span>
    <span class="st" id="status">Загрузка…</span>

  </label>
  <button class="nav" id="next" aria-label="Вперёд"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <span aria-hidden="true"></span>
</header>
<main class="desk" id="desk"><div class="spread" id="spread"></div></main>
<footer class="foot">
  <div class="tools" id="tools" hidden>
    <button class="tool" data-tool="text" aria-pressed="true">Текст</button>
    <button class="tool" data-tool="check" aria-pressed="false">Туду</button>
    <button class="tool" data-tool="pen" aria-pressed="false">Перо</button>
    <button class="tool" data-tool="marker" aria-pressed="false">Маркер</button>
    <button class="tool" data-tool="eraser" aria-pressed="false">Ластик</button>
    <span class="sep"></span>
    <span id="swatches" style="display:flex"></span>
    <span class="sep"></span>
    <button class="sz" data-sz="2" aria-label="Тонкая линия" aria-pressed="false"><i style="width:4px;height:4px"></i></button>
    <button class="sz" data-sz="3.5" aria-label="Средняя линия" aria-pressed="true"><i style="width:8px;height:8px"></i></button>
    <button class="sz" data-sz="6" aria-label="Толстая линия" aria-pressed="false"><i style="width:12px;height:12px"></i></button>
    <span class="sep"></span>
    <button class="tool" id="undo">Отменить</button>
    <button class="tool" id="clear">Стереть</button>
  </div>
  <div class="frow">
  <div class="seg" role="group" aria-label="Раздел">
    <button id="tab-m" aria-pressed="true">Месяцы</button>
    <button id="tab-w" aria-pressed="false">Недели</button>
  </div>
  </div>
</footer>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cfile" accept="image/*" hidden>

<script>
(function(){
"use strict";
const Y=2027;
/* the diary runs from October 2026 to December 2027 */
const START=new Date(2026,9,1),END=new Date(2027,11,31);
const ML=[];for(let d=new Date(START);d<=END;d=new Date(d.getFullYear(),d.getMonth()+1,1))ML.push({y:d.getFullYear(),m:d.getMonth()});
const mIndex=(y,m)=>Math.max(0,Math.min(ML.length-1,(y-START.getFullYear())*12+m-START.getMonth()));
const inRange=d=>d>=START&&d<=END;
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MGEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MSHORT=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WDFULL=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
const HOL={"01-01":"Новый год","01-02":"Каникулы","01-03":"Каникулы","01-04":"Каникулы","01-05":"Каникулы","01-06":"Каникулы","01-07":"Рождество","01-08":"Каникулы","02-23":"День защитника Отечества","03-08":"Международный женский день","05-01":"Праздник Весны и Труда","05-09":"День Победы","06-12":"День России","11-04":"День народного единства"};
/* calm month tints: same hue family as before, low saturation */
const TINT=["#ecd3c8","#efd5df","#e3e6c6","#d3e2ec","#d2e6d8","#efe2bf","#efd8c4","#dfd8ee","#ebdfc3","#ecd0c6","#d5dbef","#cfe5de"];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>(d.getDay()+6)%7;
const mondayOf=d=>addDays(d,-dow(d));
const holiday=d=>inRange(d)?HOL[pad(d.getMonth()+1)+"-"+pad(d.getDate())]:null;
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY=iso(new Date());
const FIRST_MON=mondayOf(START);
const WEEKS=[];for(let d=FIRST_MON;d<=END;d=addDays(d,7))WEEKS.push(d);
const weekIndexOf=d=>Math.max(0,Math.min(WEEKS.length-1,Math.round((mondayOf(d)-FIRST_MON)/(7*864e5))));
const parseISO=t=>new Date(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10));

/* perforation mask */
(function(){
  const W=400,H=500,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#000";x.fillRect(0,0,W,H);x.globalCompositeOperation="destination-out";
  const r=8.5,nx=15,ny=19,hole=(px,py)=>{x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();};
  for(let i=0;i<=nx;i++){hole(i*W/nx,0);hole(i*W/nx,H);}
  for(let j=0;j<=ny;j++){hole(0,j*H/ny);hole(W,j*H/ny);}
  document.documentElement.style.setProperty("--perf","url("+c.toDataURL()+")");
})();

/* storage: private per person in the cloud, else this browser */
const DEL={};
const Store=(function(){
  let db=null,uid=null,mode="local",readOnly=false,lastErr="";
  const ready=(async()=>{
    try{
      if(!window.claude||typeof window.claude.use!=="function")return;
      const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(d&&u){
        const id=await u.id();
        let canWrite=null;try{if(typeof u.can==="function")canWrite=await u.can("data.write");}catch(e){}
        /* visitors who can't write here (e.g. friends on a public link) keep their diary in their own browser */
        if(id&&canWrite!==false){db=d;uid=id;mode="cloud";}
      }
    }catch(e){}
  })().finally(()=>status());
  const LK="hb2027:";
  const lget=id=>{try{const v=localStorage.getItem(LK+id);return v?JSON.parse(v):null;}catch(e){return null;}};
  const lset=(id,v)=>{try{if(v===DEL)localStorage.removeItem(LK+id);else localStorage.setItem(LK+id,JSON.stringify(v));}catch(e){throw {code:"quota_exceeded"};}};
  const col=()=>db.collection("data/users/"+uid);
  async function get(id){
    await ready;
    if(mode==="cloud"){try{const s=await col().doc(id).get();return s.exists?s.data():null;}catch(e){return null;}}
    return lget(id);
  }
  async function byMonth(m){
    await ready;const out={};
    if(mode==="cloud"){
      try{const q=await col().where("month","==",m).get();q.docs.forEach(d=>{const v=d.data();if(v&&v.kind==="photo")out[v.date]=v.img;});}catch(e){}
      return out;
    }
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LK+"photo-"+m)){const v=lget(k.slice(LK.length));if(v)out[v.date]=v.img;}}}catch(e){}
    return out;
  }
  async function write(id,v){
    if(mode!=="cloud"){lset(id,v);return;}
    const ref=col().doc(id),go=()=>v===DEL?ref.delete():ref.set(v);
    try{await go();}catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*800));await go();}
      else throw e;
    }
  }
  const q=new Map();let inflight=0;
  function set(id,v){let e=q.get(id);if(!e){e={busy:false,next:null};q.set(id,e);}e.next=v;pump(id,e);}
  async function pump(id,e){
    if(e.busy)return;
    await ready;
    while(e.next!==null){
      const v=e.next;e.next=null;e.busy=true;inflight++;status();
      try{if(!readOnly)await write(id,v);lastErr="";}
      catch(err){
        const c=err&&err.code;
        if(c==="quota_exceeded")lastErr="Место закончилось: удалите несколько фото";
        else if(c==="invalid_argument"&&mode==="cloud"){mode="local";try{lset(id,v);lastErr="";}catch(e2){lastErr="Место закончилось: удалите несколько фото";}}
        else lastErr="Не сохранилось, попробуйте ещё раз";
      }
      e.busy=false;inflight--;
    }
    status();
  }
  function status(msg){
    const el=$("#status");el.classList.toggle("warn",!!(msg||lastErr)||mode!=="cloud");
    el.textContent=msg||lastErr||(inflight?"Сохраняю…":mode==="cloud"?"Всё сохранено":"Сохраняется только на этом устройстве");
  }
  return {get,set,byMonth,status};
})();

/* state */
const state={view:"m",m:0,w:0,cover:"flowers",tool:"text",color:0,size:3.5,penSeen:false,two:null};
const INK=["#000","#c9573f","#5279ad","#4f8a63","#c48a2c"];
const spread=$("#spread");
let renderToken=0,pw=360,ph=520,inks=[],history_=[],inkKey="",saveTmr=null;

/* layout: two pages side by side only on a wide landscape screen; otherwise one page per screen */
function measure(){
  const desk=$("#desk"),cs=getComputedStyle(desk);
  const W=desk.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const H=desk.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const r=0.7;let two=W>=900&&W/H>1.15,w=0;
  if(two){w=Math.min(W/2,H*r);if(w<380)two=false;}
  return {two,W,H,w};
}
function layout(){
  const m=measure();
  if(state.two!==null&&m.two!==state.two){state.two=m.two;return render();}
  state.two=m.two;
  let em;
  if(m.two){pw=Math.floor(m.w);ph=Math.floor(m.w/0.7);em=pw/30;}
  else{pw=Math.floor(Math.min(m.W,640));ph=Math.floor(Math.max(m.H,520));em=Math.max(13,Math.min(17,pw/25));}
  spread.classList.toggle("two",m.two);
  const st=spread.style;
  st.setProperty("--pw",pw+"px");st.setProperty("--ph",ph+"px");
  st.setProperty("--phf",Math.floor(Math.max(m.H,state.view==="w"?Math.max(760,em*52):500))+"px");
  st.setProperty("--phg",Math.floor(Math.max(pw/0.7,m.H))+"px");
  st.setProperty("--em",em.toFixed(2)+"px");
  st.setProperty("--sq",(pw/(m.two?28:22)).toFixed(2)+"px");
  inks.forEach(p=>p.resize());
  document.querySelectorAll(".ti .tt").forEach(fit);
  document.querySelectorAll(".ti.done").forEach(r=>refreshStrike(r));
}

/* navigation */
function fillJump(){
  const s=$("#jump");s.innerHTML="";
  if(state.view==="m")ML.forEach((x,i)=>s.add(new Option(MONTHS[x.m]+" "+x.y,i)));
  else WEEKS.forEach((d,i)=>{const e=addDays(d,6);s.add(new Option(d.getDate()+" "+MSHORT[d.getMonth()]+" – "+e.getDate()+" "+MSHORT[e.getMonth()]+" "+e.getFullYear(),i));});
  s.value=state.view==="m"?state.m:state.w;
}
function go(view,i,push){
  state.view=view;
  if(view==="m")state.m=Math.max(0,Math.min(ML.length-1,i));else state.w=Math.max(0,Math.min(WEEKS.length-1,i));
  $("#tab-m").setAttribute("aria-pressed",view==="m");$("#tab-w").setAttribute("aria-pressed",view==="w");
  $("#tools").hidden=view!=="w";
  let mi=state.m;
  if(view==="w"){
    const mon=WEEKS[state.w],t=addDays(mon,3),e=addDays(mon,6);mi=mIndex(t.getFullYear(),t.getMonth());
    $("#t-num").hidden=true;
    $("#t-name").textContent=mon.getMonth()===e.getMonth()?mon.getDate()+" – "+e.getDate()+" "+MGEN[e.getMonth()]:mon.getDate()+" "+MSHORT[mon.getMonth()]+" – "+e.getDate()+" "+MSHORT[e.getMonth()];
  }else{const x=ML[state.m];$("#t-num").hidden=false;$("#t-num").textContent=pad(x.m+1);$("#t-name").textContent=MONTHS[x.m]+" "+x.y;}
  document.documentElement.style.setProperty("--bright",TINT[ML[mi].m]);if(typeof applyCover==="function")applyCover();
  const meta=document.querySelector('meta[name="theme-color"]')||document.head.appendChild(Object.assign(document.createElement("meta"),{name:"theme-color"}));meta.content=TINT[ML[mi].m];
  fillJump();
  const h="#"+(view==="m"?"m-"+ML[state.m].y+"-"+pad(ML[state.m].m+1):"w-"+iso(WEEKS[state.w]));
  if(push!==false&&location.hash!==h){try{history.replaceState(null,"",h);}catch(e){location.hash=h;}}
  render();
  $("#desk").scrollTop=0;
}
function fromHash(){
  const h=location.hash||"";let r;
  if((r=/^#m-(\d{4})-(\d{2})$/.exec(h)))return go("m",mIndex(+r[1],+r[2]-1),false);
  if((r=/^#w-(\d{4}-\d{2}-\d{2})$/.exec(h)))return go("w",weekIndexOf(parseISO(r[1])),false);

async function toStampJPEG(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const TW=480,TH=600,sr=img.naturalWidth/img.naturalHeight,tr=TW/TH;let sw,sh,sx,sy;
    if(sr>tr){sh=img.naturalHeight;sw=sh*tr;sx=(img.naturalWidth-sw)/2;sy=0;}else{sw=img.naturalWidth;sh=sw/tr;sx=0;sy=(img.naturalHeight-sh)/2;}
    const c=document.createElement("canvas");c.width=TW;c.height=TH;const x=c.getContext("2d");
    x.imageSmoothingQuality="high";x.drawImage(img,sx,sy,sw,sh,0,0,TW,TH);
    let q=0.82,out=c.toDataURL("image/jpeg",q);
    while(out.length>200000&&q>0.4){q-=0.12;out=c.toDataURL("image/jpeg",q);}

  }finally{URL.revokeObjectURL(url);}
}

const boxCache={};
/* put the box on the first written line, using the font's real metrics (they differ between iPhone, iPad and desktop) */
function alignBox(el){
  const row=el.closest(".ti");if(!row)return;const cb=row.querySelector(".cb");if(!cb)return;
  const cs=getComputedStyle(el),key=cs.fontSize+cs.fontFamily+cs.lineHeight+cs.paddingTop+cb.offsetHeight;
  let top=boxCache[key];
  if(top===undefined){
    measureCtx.font=cs.fontSize+" "+cs.fontFamily;
    const m=measureCtx.measureText("Мама Лото"),x=measureCtx.measureText("хоа");
    const fs=parseFloat(cs.fontSize),lh=parseFloat(cs.lineHeight)||fs*1.2,pt=parseFloat(cs.paddingTop)||0;
    const fa=m.fontBoundingBoxAscent||fs*.8,fd=m.fontBoundingBoxDescent||fs*.2,xh=x.actualBoundingBoxAscent||fs*.45;
    const base=pt+(lh-(fa+fd))/2+fa,center=base-xh*.62,h=cb.offsetHeight||fs*.9;
    top=boxCache[key]=Math.round((center-h/2)*10)/10;
  }
  cb.style.marginTop=top+"px";
}
function fit(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";alignBox(el);}
let todo={mode:"grid",items:[]},todoKey="",todoTmr=null;
const rid=()=>Math.random().toString(36).slice(2,9);
const clean=items=>items.filter(i=>i.t.trim()).map(i=>({id:i.id,t:i.t,d:!!i.d,c:i.c!==false}));
function saveTodo(){clearTimeout(todoTmr);const k=todoKey,doc={kind:"wtodo",mode:todo.mode,items:clean(todo.items)};todoTmr=setTimeout(()=>Store.set(k,doc),600);}
function setupTodo(key,tok){
  todoKey="wtodo-"+key;todo={mode:"grid",items:[]};
  const page=$("#rpage");
  page.querySelector(".mini").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b)return;todo.mode=b.dataset.mode;paintTodoMode();saveTodo();if(todo.mode==="todo"&&!todo.items.length){const n=page.querySelector(".ti.new .tt");if(n)n.focus();}});
  paintTodoMode();
  Store.get(todoKey).then(v=>{if(tok!==renderToken||!v)return;todo.mode=v.mode==="todo"?"todo":"grid";todo.items=(v.items||[]).map(i=>({id:i.id||rid(),t:i.t||"",d:!!i.d}));paintTodoMode();});
}
function paintTodoMode(){
  const page=$("#rpage");if(!page)return;
  page.classList.toggle("mode-todo",todo.mode==="todo");
  page.querySelectorAll(".mini button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===todo.mode));
  $("#rtitle").textContent=todo.mode==="todo"?"Дела на неделю":"Заметки";
  const g=$("#garea");g.innerHTML="";
  if(todo.mode!=="todo")return;
  const box=document.createElement("div");box.className="todo";g.appendChild(box);
  todo.forceC=true;fillList(box,todo,saveTodo,"Новое дело");
}
/* days on the left page: one checklist per day */
let days={lists:[]},daysKey="",daysTmr=null;
function saveDays(){clearTimeout(daysTmr);const k=daysKey,doc={kind:"wday",days:days.lists.map(l=>clean(l.items))};daysTmr=setTimeout(()=>Store.set(k,doc),600);}
function setupDays(key,tok){
  daysKey="wday-"+key;days={lists:[0,1,2,3,4,5,6].map(()=>({items:[]}))};
  const boxes=[...spread.querySelectorAll(".dlist")];
  boxes.forEach(b=>{
    b.addEventListener("focusin",()=>boxes.forEach(x=>x.classList.toggle("active",x===b)));
    b.addEventListener("click",e=>{if(e.target.closest(".ti:not(.new)"))return;const n=b.querySelector(".ti.new .tt");if(n&&document.activeElement!==n)n.focus();});
  });
  const dayRow=b=>b.closest(".day");
  boxes.forEach(b=>{const d=dayRow(b);if(d)d.addEventListener("click",e=>{if(e.target.closest(".dlist"))return;const n=b.querySelector(".ti.new .tt");if(n)n.focus();});});
  const paint=()=>boxes.forEach((b,k)=>{b.innerHTML="";fillList(b,days.lists[k],saveDays,k===0&&!days.lists.some(l=>l.items.length)?"Пишите здесь":"");});
  paint();
  Promise.all([Store.get(daysKey),Store.get("wtext-"+key)]).then(([v,old])=>{
    if(tok!==renderToken)return;
    if(v&&Array.isArray(v.days))days.lists=days.lists.map((l,k)=>({items:(v.days[k]||[]).map(i=>({id:i.id||rid(),t:i.t||"",d:!!i.d,c:i.c!==false}))}));
    else if(old&&Array.isArray(old.d)){ /* earlier typed notes become items, one per line */
      days.lists=days.lists.map((l,k)=>({items:String(old.d[k]||"").split("\n").map(x=>x.trim()).filter(Boolean).map(t=>({id:rid(),t,d:false,c:false}))}));
      if(days.lists.some(l=>l.items.length))saveDays();
    }else return;
    paint();
  });
}
function fillList(box,model,save,ph){
  model.items.forEach(it=>box.appendChild(todoRow(it,model,save)));
  box.appendChild(todoRow(null,model,save,ph));
  requestAnimationFrame(()=>box.querySelectorAll(".ti.done").forEach(r=>refreshStrike(r)));
}
function refreshStrike(row){
  const inp=row.querySelector(".tt"),tw=row.querySelector(".tw"),old=tw.querySelector(".strike");if(old)old.remove();
  if(row.classList.contains("done")&&inp.value)tw.insertAdjacentHTML("beforeend",strikeSVG(inp,row.dataset.id));
  return tw.querySelector(".strike path");
}
/* the to-do tool places one box, then hands back to plain text */
function oneShotDone(){if(state.tool!=="check")return;state.tool="text";applyTool();}
function todoRow(it,model,save,ph){
  const row=document.createElement("div"),isNew=!it,id=it?it.id:"new";
  const hasBox=()=>it?it.c!==false:(model.forceC||row.dataset.c==="1");
  const sync=()=>{row.classList.toggle("plain",!hasBox());row.classList.toggle("done",!!(it&&it.d&&hasBox()));row.querySelector(".cb").setAttribute("aria-pressed",!!(it&&it.d));if(row.classList.contains("done"))refreshStrike(row);else{const o=row.querySelector(".strike");if(o)o.remove();}};
  row.className="ti"+(isNew?" new":"");row.dataset.id=id;
  row.innerHTML='<button class="cb" aria-label="Отметить выполненным" aria-pressed="false">'+boxSVG(id)+'</button><div class="tw"><textarea class="tt" rows="1" enterkeyhint="next" '+(isNew&&ph?'placeholder="'+esc(ph)+'"':'')+' aria-label="'+(isNew?"Новая строка":"Строка")+'"></textarea></div>'+(isNew?'':'<button class="tx-del" aria-label="Удалить строку">×</button>');
  const inp=row.querySelector(".tt");inp.value=it?it.t:"";
  requestAnimationFrame(()=>fit(inp));
  row.classList.toggle("plain",!hasBox());if(it&&it.d&&hasBox())row.classList.add("done");
  row.querySelector(".cb").setAttribute("aria-pressed",!!(it&&it.d));
  row.querySelector(".cb").addEventListener("click",()=>{
    if(!it){inp.focus();return;}
    if(it.c===false){it.c=true;it.d=false;sync();save();oneShotDone();return;} /* checkbox tool: tap the faint box to turn a line into a to-do */
    it.d=!it.d;sync();
    if(it.d){const p=row.querySelector(".strike path");if(p&&!matchMedia("(prefers-reduced-motion: reduce)").matches){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.strokeDashoffset=0;}}
    save();
  });
  inp.addEventListener("input",()=>{
    if(isNew&&inp.value.trim()){
      const c=model.forceC||document.body.classList.contains("tool-check")||row.dataset.c==="1";
      const n={id:rid(),t:inp.value,d:false,c};model.items.push(n);
      const real=todoRow(n,model,save);row.parentElement.insertBefore(real,row);
      const ri=real.querySelector(".tt");ri.focus();ri.setSelectionRange(ri.value.length,ri.value.length);requestAnimationFrame(()=>fit(ri));
      inp.value="";inp.removeAttribute("placeholder");row.dataset.c="";if(c&&!model.forceC)oneShotDone();row.classList.toggle("plain",!(model.forceC||document.body.classList.contains("tool-check")));save();return;
    }
    if(it){it.t=inp.value;fit(inp);if(row.classList.contains("done"))refreshStrike(row);save();}
  });
  const remove=()=>{const f=row.previousElementSibling||row.nextElementSibling;model.items=model.items.filter(x=>x!==it);row.remove();save();if(f)f.querySelector(".tt").focus();};
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();const nx=row.nextElementSibling;if(!nx)return;
      if(nx.classList.contains("new")){const c=model.forceC||document.body.classList.contains("tool-check");nx.dataset.c="";nx.classList.toggle("plain",!c);}
      nx.querySelector(".tt").focus();
    }
    if(e.key==="Backspace"&&it){
      if(!inp.value){e.preventDefault();remove();}
      else if(inp.selectionStart===0&&inp.selectionEnd===0&&it.c!==false&&!model.forceC){e.preventDefault();it.c=false;it.d=false;sync();save();} /* backspace at line start drops the box */
    }
  });
  const del=row.querySelector(".tx-del");if(del)del.addEventListener("click",()=>{model.items=model.items.filter(x=>x!==it);row.remove();save();});
  return row;
}

];
function curTint(){return getComputedStyle(document.documentElement).getPropertyValue("--bright").trim()||TINT[0];}
function coverOf(id){return COVERS.find(c=>c.id===id)||COVERS[0];}
function applyCover(){
  let c=coverOf(state.cover);if(c.id==="custom"&&!customCover)c=COVERS[0];
  const bg=c.bg(curTint(),"var(--tile)");
  document.body.style.background=bg;
  $("#cover-btn").style.background=c.bg(curTint(),"90px");
}
function coverSheet(){
  const t=curTint();
  let h='<h2>Обложка</h2><div class="covers">';
  COVERS.forEach(c=>{
    const bg=c.bg(t,"120px");
    h+='<button class="cv" data-cv="'+c.id+'" aria-pressed="'+(state.cover===c.id&&(c.id!=="custom"||!!customCover))+'"><span class="pv"'+(bg?' style="background:'+esc(bg)+'"':'')+'>'+(bg?'':'+')+'</span>'+c.name+'</button>';
  });
  h+='</div>'+(customCover?'<button class="linkbtn" data-act="cpick">Загрузить другую картинку</button>':'')+'<div class="acts"><button class="btn primary" data-act="close">Готово</button></div>';
  showModal(h,{cpick:()=>$("#cfile").click()});
}
function setCover(id){
  if(id==="custom"&&!customCover){$("#cfile").click();return;}
  state.cover=id;applyCover();Store.set("settings",{kind:"settings",cover:id});
  mbox.querySelectorAll(".cv").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cv===id));
}
$("#cover-btn").onclick=coverSheet;
mbox.addEventListener("click",e=>{const b=e.target.closest(".cv");if(b)setCover(b.dataset.cv);});
$("#cfile").addEventListener("change",async()=>{
  const f=$("#cfile").files&&$("#cfile").files[0];$("#cfile").value="";if(!f)return;
  try{
    const url=URL.createObjectURL(f),img=new Image();img.src=url;await img.decode();
    const k=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    let q=0.8,out=c.toDataURL("image/jpeg",q);while(out.length>220000&&q>0.4){q-=0.1;out=c.toDataURL("image/jpeg",q);}
    customCover=out;Store.set("cover-custom",{kind:"cover",img:out});
    setCover("custom");if(!modal.hidden)coverSheet();
  }catch(err){showModal('<h2>Не получилось открыть картинку</h2><p>Попробуйте другой файл: подходят JPEG, PNG и HEIC.</p><div class="acts"><button class="btn primary" data-act="close">Понятно</button></div>');}
});
Store.get("settings").then(async v=>{
  if(v&&v.cover){state.cover=v.cover;if(v.cover==="custom"){const c=await Store.get("cover-custom");if(c&&c.img)customCover=c.img;}}
  applyCover();
});

window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,120);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{inks.forEach(p=>p.resize());document.querySelectorAll(".ti .tt").forEach(fit);document.querySelectorAll(".ti.done").forEach(r=>refreshStrike(r));});
fromHash();
})();
</script>
</body>
</html>
